[package]
name = "quasiquote0"
version = "0.1.0"
authors = ["Rynco Maekawa <lynzrand@outlook.com>"]
edition = "2021"
default-run = "quasiquote0"
resolver = "2"
rust-version = "1.82"

[profile.release]
opt-level = "s"

[features]
# Opt-in hardware experiment; the normal firmware keeps its proven full refresh.
experimental-partial = []
legacy-usb = []

[[bin]]
name = "quote0-clock"
path = "src/bin/quote0-clock.rs"
required-features = ["legacy-usb"]

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"
[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
embedded-graphics = "0.8"
embedded-svc = "0.29"
esp-idf-hal = "0.46"
esp-idf-sys = "0.37"
esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }

[build-dependencies]
embuild = "0.33"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "joltwallet/littlefs", version = "~1.20.0" }
bindings_header = "include/littlefs_bindings.h"
